<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Trouvez un électricien disponible près de chez vous à Nabeul et appelez-le directement. Par Log-ON lighting.">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Log-ON">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Log-ON Électriciens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Dancing+Script:wght@600&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg-outer:#E7E7E2; --bg:#F4F4F1; --surface:#FFFFFF; --surface-2:#ECECE7; --ink:#171717; --ink-2:#45453F; --muted:#7A7A73; --line:#DEDED8;
  --accent:#F2B233; --accent-ink:#171717; --accent-soft:#FFF1D0;
  --ok:#1B9457; --ok-soft:#E1F4E8; --off:#CF4038; --off-soft:#FBE6E4;
  --hdr:#161616; --hdr-fg:#FFFFFF; --hdr-sub:rgba(255,255,255,.62); --hdr-line:rgba(255,255,255,.12); --hdr-pill:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(23,23,23,.05),0 10px 28px rgba(23,23,23,.08);
  --radius:16px;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:Outfit,"Nunito Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-outer:#0A0A0A; --bg:#131312; --surface:#1C1C1B; --surface-2:#262624; --ink:#F1F1EC; --ink-2:#C6C6BE; --muted:#8F8F87; --line:#2D2D2A;
    --accent:#F2B233; --accent-ink:#171717; --accent-soft:#3A2D10;
    --ok:#3ECB7D; --ok-soft:#143726; --off:#F1685F; --off-soft:#421C19;
    --hdr:#0E0E0E; --hdr-fg:#FFFFFF; --hdr-sub:rgba(255,255,255,.6); --hdr-line:rgba(255,255,255,.12); --hdr-pill:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg-outer:#0A0A0A; --bg:#131312; --surface:#1C1C1B; --surface-2:#262624; --ink:#F1F1EC; --ink-2:#C6C6BE; --muted:#8F8F87; --line:#2D2D2A;
  --accent:#F2B233; --accent-ink:#171717; --accent-soft:#3A2D10;
  --ok:#3ECB7D; --ok-soft:#143726; --off:#F1685F; --off-soft:#421C19;
  --hdr:#0E0E0E; --hdr-fg:#FFFFFF; --hdr-sub:rgba(255,255,255,.6); --hdr-line:rgba(255,255,255,.12); --hdr-pill:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
/* Arabic: one typeface for everything, no letter-spacing (it breaks joined letters), a little more line-height */
[dir="rtl"]{--font-body:Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;--font-display:Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif}
[dir="rtl"] body{line-height:1.6}
[dir="rtl"] .eyebrow,[dir="rtl"] .you,[dir="rtl"] .pill,[dir="rtl"] .wordmark small,[dir="rtl"] .tabbar button,[dir="rtl"] .welcome .by{letter-spacing:0}
[dir="rtl"] .welcome .by{font-family:var(--font-display);font-weight:700;font-size:16px}
[dir="rtl"] h1{font-weight:800}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
.ic.fill{fill:currentColor;stroke:none}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}
h1{font-size:26px;line-height:1.12;font-weight:700}
h2{font-size:19px;font-weight:600;line-height:1.2}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
.lead{color:var(--ink-2)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.app.tabs{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.app{border-inline:1px solid var(--line)}}

/* language pill */
.langbtn{border:1px solid var(--hdr-line);background:var(--hdr-pill);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.langbtn .ic{width:15px;height:15px;color:var(--accent)}
.langseg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin-inline-start:auto}
.langseg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12.5px;color:var(--muted)}
.langseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- welcome ---------- */
.welcome{flex:1;background:var(--hdr);color:var(--hdr-fg);display:flex;flex-direction:column;gap:22px;padding:16px 20px 28px;background-image:radial-gradient(60% 40% at 50% 0%,rgba(242,178,51,.22),transparent 70%)}
.welcome .topline{display:flex;justify-content:flex-end}
.welcome .glow{position:relative;width:96px;height:96px;margin:0 auto;display:grid;place-items:center;color:var(--accent)}
.welcome .glow::before{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(242,178,51,.38),transparent 62%)}
.welcome .glow .ic{width:72px;height:72px;position:relative;filter:drop-shadow(0 0 14px rgba(242,178,51,.55))}
.welcome .titles{text-align:center}
.welcome .titles .by{font-family:"Dancing Script",cursive;font-size:20px;color:var(--accent);display:block;margin-bottom:2px}
.welcome h1{font-size:30px}
.welcome .tag{color:var(--hdr-sub);margin-top:8px;font-size:15px}
.door{background:var(--hdr-pill);border:1px solid var(--hdr-line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.door h2{color:#fff;display:flex;align-items:center;gap:10px}
.door h2 .ic{color:var(--accent);width:22px;height:22px}
.door p{color:var(--hdr-sub);font-size:14px}
.door .row{display:flex;gap:8px;margin-top:4px}
.welcome .foot{text-align:center;color:var(--hdr-sub);font-size:13.5px;margin-top:auto}
.welcome .foot button{border:0;background:none;color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* ---------- auth ---------- */
.authbar{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.authbar button{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
[dir="rtl"] .authbar button .ic{transform:scaleX(-1)}
.auth{padding:12px 20px 32px;display:flex;flex-direction:column;gap:18px}
.auth .form{gap:16px}
.codebox{font-family:var(--font-display);font-size:32px;letter-spacing:.5em;text-align:center;padding:14px 0 14px .5em !important;font-weight:600;direction:ltr}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:13.5px;color:var(--ink)}
.hint .ic{color:var(--accent);margin-top:1px}
.hint b{font-family:var(--font-display);letter-spacing:.15em;font-size:15px;direction:ltr;unicode-bidi:isolate}
.linkrow{display:flex;justify-content:center;gap:18px;font-size:13.5px}
.linkrow button{border:0;background:none;font-weight:800;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-fg);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:50%;box-shadow:0 0 0 1px var(--hdr-line);direction:ltr}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.wordmark small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--hdr-sub);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.acctbtn{border:1px solid var(--hdr-line);background:var(--hdr-pill);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;flex:none;overflow:hidden}
.acctbtn img{width:100%;height:100%;object-fit:cover}

/* ---------- client home ---------- */
.darkblock{background:var(--hdr);color:var(--hdr-fg);padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.darkblock .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.darkblock .count{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.2}
.darkblock .count b{color:var(--ok);font-weight:700}
.darkblock .count span{display:block;font-family:var(--font-body);font-size:13px;color:var(--hdr-sub);font-weight:600}
.locbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hdr-line);background:var(--hdr-pill);color:#fff;border-radius:999px;padding:8px 10px 8px 9px;font-weight:700;font-size:13px;max-width:52%;white-space:nowrap}
.locbtn span{overflow:hidden;text-overflow:ellipsis}
.locbtn .ic{width:15px;height:15px;color:var(--accent)}
.locbtn .chev{color:var(--hdr-sub);width:13px;height:13px}
.radar{width:100%;height:auto;display:block;border-radius:18px 18px 0 0;background:radial-gradient(circle at 50% 52%,rgba(242,178,51,.10),rgba(255,255,255,.02) 70%);border:1px solid var(--hdr-line);border-bottom:0;direction:ltr}
.radar .ring{fill:none;stroke:rgba(255,255,255,.14)}
.radar .lbl{fill:rgba(255,255,255,.55);font-size:9.5px;font-weight:700;font-family:var(--font-body)}
.radar .sweep{transform-box:view-box;transform-origin:160px 112px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .dot{cursor:pointer}
.radar .dot text{fill:#fff;font-size:8.5px;font-weight:800;font-family:var(--font-body);pointer-events:none}
.radar .dot .halo{fill:var(--ok);opacity:.22}
.radar .dot.off circle.core{fill:#6E6E68}
.radar .dot.off .halo{display:none}
.radar .dot.mine circle.core{stroke:var(--accent);stroke-width:2}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--hdr-sub);border:1px solid var(--hdr-line);border-top:0;border-radius:0 0 18px 18px;padding:8px 12px;margin-top:-12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.content{padding:16px;display:flex;flex-direction:column;gap:14px}

/* segmented + chips */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:800;padding:0 6px}
.seg button[aria-pressed="true"] .cnt{background:var(--ok);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip.sel[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.el{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;cursor:pointer;transition:transform .08s ease,box-shadow .15s ease}
.el:active{transform:scale(.99)}
@media (hover:hover){.el:hover{box-shadow:var(--shadow)}}
.el.off{opacity:.7}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff;overflow:hidden;background:var(--h,#5B6B7A);position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;font-size:26px;border-radius:20px}
.avatar .pip{position:absolute;inset-inline-end:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
.avatar .pip.off{background:var(--off)}
.el-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.2}
.you{font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 6px;margin-inline-start:6px;vertical-align:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 9px 4px 7px;white-space:nowrap;flex:none}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.off{background:var(--off-soft);color:var(--off)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:800}
.meta .ic{width:14px;height:14px;color:var(--accent)}
.meta .ic.pin{color:var(--muted)}
.skills{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;flex:1;min-height:42px;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.light{background:#fff;color:#171717;border-color:#fff}
.btn.onDark{background:var(--hdr-pill);color:#fff;border-color:var(--hdr-line)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--off);border-color:color-mix(in srgb,var(--off) 40%,transparent)}
.btn.block{width:100%}
.btn.lg{padding:14px 16px;font-size:15.5px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.note .ic{color:var(--accent);margin-top:1px}
.note b{color:var(--ink-2)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .ic{width:28px;height:28px;color:var(--accent);margin-bottom:6px}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.field label em{font-style:normal;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 12px;font-size:16px;color:var(--ink)}
.field textarea{min-height:88px;resize:vertical}
.field .err{color:var(--off);font-size:12.5px;font-weight:700;display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .tel-wrap{border-color:var(--off)}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-row input{display:none}
.photo-row .btn{flex:none}
.tel-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;direction:ltr}
.tel-wrap span{padding:12px 12px;background:var(--surface-2);font-weight:800;color:var(--muted);border-right:1px solid var(--line)}
.tel-wrap input{border:0 !important;border-radius:0 !important;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px}
.kv b{font-variant-numeric:tabular-nums}

/* status card */
.statuscard{border-radius:20px;padding:18px;color:#fff;background:var(--off);transition:background .25s ease;background-image:radial-gradient(70% 60% at 100% 0%,rgba(255,255,255,.14),transparent 70%)}
.statuscard.on{background-color:var(--ok)}
.statuscard .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.statuscard .big{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;display:flex;align-items:center;gap:10px}
.statuscard .big .dot{width:12px;height:12px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.statuscard p{opacity:.94;margin-top:8px;font-size:14px}
.switch{width:64px;height:36px;border-radius:999px;border:0;background:rgba(0,0,0,.28);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:rgba(255,255,255,.35)}
.switch[aria-checked="true"]::after{transform:translateX(28px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-28px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}

/* rows (store, account) */
.rows{display:flex;flex-direction:column}
.rows a,.rows button,.rows div.r{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;font-weight:700;border-left:0;border-right:0;border-bottom:0;background:none;text-align:start;width:100%;font-size:14.5px}
.rows > :first-child{border-top:0}
.rows .ic{color:var(--accent)}
.rows .arrow{margin-inline-start:auto;color:var(--muted);transform:rotate(-90deg)}
[dir="rtl"] .rows .arrow{transform:rotate(90deg)}
.rows .sub{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:13px}
.rows .danger{color:var(--off)}
.rows .danger .ic{color:var(--off)}
.storehead{display:flex;gap:14px;align-items:center}
.storehead .logo{width:72px;height:72px;box-shadow:0 0 0 1px var(--line)}
.soon{display:flex;flex-direction:column;gap:10px}
.soon div{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;color:var(--ink-2);font-size:14px}
.soon .ic{color:var(--accent);margin-top:2px}
.soon b{color:var(--ink)}
.acct-head{display:flex;gap:14px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2)}
.pill.pro{background:var(--accent-soft)}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
@media (min-width:720px){.tabbar{border-inline:1px solid var(--line)}}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.01em;position:relative}
.tabbar button .ic{width:22px;height:22px}
.tabbar button[aria-pressed="true"]{color:var(--ink)}
.tabbar button[aria-pressed="true"] .ic{color:var(--accent)}
.tabbar .live{position:absolute;top:6px;inset-inline-end:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:480px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:92dvh;box-shadow:var(--shadow)}
dialog[open]{display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(10,10,10,.5)}
@media (min-width:720px){dialog{margin:auto;border-radius:22px;max-height:86dvh}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-body{overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.close{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.phead{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.review{border-top:1px solid var(--line);padding:10px 0}
.review:first-of-type{border-top:0;padding-top:0}
.review .who{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.review .who span{color:var(--muted);font-weight:600}
.review p{margin-top:3px;font-size:14px;color:var(--ink-2)}
.stars{color:var(--accent);display:inline-flex;gap:1px}
.stars .ic{width:14px;height:14px}
.stars .ic.dim{opacity:.25}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:transparent;padding:2px;color:var(--line)}
.starpick button.on{color:var(--accent)}
.starpick .ic{width:30px;height:30px}
.citylist{display:flex;flex-direction:column}
.citylist button{border:0;background:transparent;text-align:start;padding:13px 4px;border-top:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px}
.citylist button .ic{color:var(--muted)}
.citylist button.on .ic{color:var(--ok)}
.citylist button:first-child{border-top:0}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:13.5px;max-width:min(440px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

  origin:load(K.loc,null)||{...CITIES[0],label:null},
  accounts:load(K.acc,{}), session:load(K.ses,null),
  reviews:load(K.rev,{}), stats:load(K.stats,{views:0,calls:0}),
  auth:null,
};
lang=load(K.lang,null)||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'fr');
{const q=new URLSearchParams(location.search).get('lang');if(q==='ar'||q==='fr'){lang=q;save(K.lang,q)}}
const me=()=>state.session&&!state.session.guest?state.accounts[state.session.phone]||null:null;
const isPro=()=>me()?.role==='pro';
const myProfile=()=>me()?.profile||null;
const persistAccounts=()=>save(K.acc,state.accounts);
const originLabel=()=>state.origin.id==='gps'?t('loc.mypos'):L((CITIES.find(c=>c.id===state.origin.id)||CITIES[0]).name);

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R2D=Math.PI/180;
function km(a,b){const Rk=6371,dLat=(b.lat-a.lat)*R2D,dLng=(b.lng-a.lng)*R2D,la1=a.lat*R2D,la2=b.lat*R2D;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*Rk*Math.asin(Math.sqrt(h))}
function bearing(a,b){const φ1=a.lat*R2D,φ2=b.lat*R2D,Δλ=(b.lng-a.lng)*R2D;const y=Math.sin(Δλ)*Math.cos(φ2),x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);return Math.atan2(y,x)}
const dec=n=>lang==='fr'?n.toFixed(1).replace('.',','):n.toFixed(1);
const fmtKm=d=>d<1?`${Math.round(d*100)*10} ${t('m')}`:d<10?`${dec(d)} ${t('km')}`:`${Math.round(d)} ${t('km')}`;
const locale=()=>lang==='ar'?'ar-TN':'fr-FR';
const fmtTime=x=>new Date(x).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'});
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const HUES=['#5B6B7A','#6E5B7A','#5B7A6A','#7A6A5B','#4F6F8F','#8A5E5E','#5E7A8A'];
const hue=n=>HUES[[...(String(n)||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%HUES.length];
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtTel=d=>d.length===8?`${d.slice(0,2)} ${d.slice(2,5)} ${d.slice(5)}`:d;
const tel=d=>`<span class="ltr tnum">+216 ${fmtTel(d)}</span>`;
const firstName=n=>(n||'').split(' ')[0];
let toastT;function toast(m){const x=$('#toast');x.textContent=m;x.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>x.classList.remove('show'),3200)}

function allElectricians(){
  const list=DEMO.map(e=>({...e,name:L(e.name),zone:L(e.zone),desc:L(e.desc),reviews:e.reviews.map(r=>({who:L(r.who),stars:r.stars,text:L(r.text),date:L(r.date)}))}));
  const mp=myProfile(); if(mp) list.push({...mp,zone:L((CITIES.find(c=>c.id===mp.zoneId)||{}).name)||mp.zone,mine:true,hueKey:me().phone});
  return list.map(e=>{
    const extra=state.reviews[e.id]||[];
    const base=(e.rating||0)*(e.count||0), sum=extra.reduce((a,r)=>a+r.stars,0), count=(e.count||0)+extra.length;
    return {...e,dist:km(state.origin,e),count,rating:count?(base+sum)/count:0,reviews:[...extra.map(r=>({...r,date:t('p.now')})),...(e.reviews||[])]};
  });
}
const avatar=(e,lg='',pip=true)=>`<div class="avatar ${lg}" style="--h:${hue(e.hueKey||e.id)}">${e.photo?`<img src="${e.photo}" alt="">`:esc(initials(e.name))}${pip?`<span class="pip ${e.available?'':'off'}"></span>`:''}</div>`;
const statusPill=e=>e.available?`<span class="status ok"><span class="dot"></span>${t('status.ok')}</span>`:`<span class="status off"><span class="dot"></span>${t('status.off')}</span>`;
const starRow=r=>`<span class="stars" aria-label="${r}/5">${[1,2,3,4,5].map(i=>ic('star','fill'+(i<=r?'':' dim'))).join('')}</span>`;
const rating=e=>e.count?`<span>${ic('star','fill')} <b>${dec(e.rating)}</b> <span class="muted">(${e.count})</span></span>`:`<span class="muted">${t('new')}</span>`;

/* ================= screens ================= */
function render(){
  const s=state.screen;
  $('#s-welcome').hidden=s!=='welcome';
  $('#s-auth').hidden=s!=='auth';
  $('#s-main').hidden=s!=='main';
  $('#tabbar').hidden=s!=='main';
  $('#app').classList.toggle('tabs',s==='main');
  if(s==='auth') renderAuth(); else $('#auth-body').innerHTML='';
  if(s==='main'){renderTabs();renderHeader();setTab(state.tab,true)}
  window.scrollTo({top:0});
}
function go(screen){state.screen=screen;render()}

/* ---------- auth ---------- */
function startAuth(mode,role){state.auth={mode,role,step:'phone',phone:'',name:''};go('auth')}
function renderAuth(){
  const a=state.auth, pro=a.role==='pro', b=$('#auth-body');
  if(a.step==='phone'){
    const title=a.mode==='signup'?(pro?t('a.signup.pro'):t('a.signup')):t('login');
    b.innerHTML=`<div><h1>${title}</h1><p class="lead" style="margin-top:6px">${pro&&a.mode==='signup'?t('a.phone.pro'):t('a.phone.sub')}</p></div>
      <form class="form" id="f-auth" novalidate>
        <div class="field" id="fw-aphone"><label for="a-phone">${t('a.phone.label')}</label><div class="tel-wrap"><span>+216</span><input id="a-phone" inputmode="tel" autocomplete="tel-national" placeholder="5x xxx xxx" value="${esc(fmtTel(a.phone))}" autofocus></div><span class="err" id="a-err">${t('a.phone.err')}</span></div>
        <button type="submit" class="btn primary lg">${ic('sms')}${t('a.sms')}</button>
      </form>
      <div class="linkrow">${a.mode==='signup'?`<span class="muted">${t('a.have')}</span><button type="button" data-switch="login">${t('login')}</button>`:`<span class="muted">${t('a.none')}</span><button type="button" data-switch="signup">${t('a.create')}</button>`}</div>`;
    $('#f-auth').addEventListener('submit',e=>{
      e.preventDefault();
      const ph=digits($('#a-phone').value), fw=$('#fw-aphone'), err=$('#a-err');
      if(ph.length!==8){err.textContent=t('a.phone.err');fw.classList.add('invalid');return}
      const exists=!!state.accounts[ph];
      if(a.mode==='login'&&!exists){err.textContent=t('a.phone.noacc');fw.classList.add('invalid');return}
      if(a.mode==='signup'&&exists){err.textContent=t('a.phone.exists');fw.classList.add('invalid');return}
      fw.classList.remove('invalid');a.phone=ph;a.step='code';renderAuth();
    });
    b.querySelector('[data-switch]').addEventListener('click',e=>{a.mode=e.target.dataset.switch;a.phone=digits($('#a-phone').value);renderAuth()});
  }
  else if(a.step==='code'){
    b.innerHTML=`<div><h1>${t('a.code.h')}</h1><p class="lead" style="margin-top:6px">${t('a.code.sub')} <b>${tel(a.phone)}</b>.</p></div>
      <form class="form" id="f-code" novalidate>
        <div class="field" id="fw-code"><input id="a-code" class="codebox" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" autofocus aria-label="${t('a.code.aria')}"><span class="err">${t('a.code.err')}</span></div>
        <div class="hint">${ic('info')}<span>${t('a.code.demo')} <b>${DEMO_CODE}</b>.</span></div>
        <button type="submit" class="btn primary lg" id="a-verify">${t('a.verify')}</button>
      </form>
      <div class="linkrow"><button type="button" id="a-resend">${t('a.resend')}</button><button type="button" id="a-change">${t('a.change')}</button></div>`;
    const input=$('#a-code');
    const verify=()=>{
      if(input.value!==DEMO_CODE){$('#fw-code').classList.add('invalid');input.select();return}
      if(a.mode==='login'){finishLogin(a.phone);return}
      a.step='name';renderAuth();
    };
    input.addEventListener('input',()=>{$('#fw-code').classList.remove('invalid');if(input.value.length===4)verify()});
    $('#f-code').addEventListener('submit',e=>{e.preventDefault();verify()});
    $('#a-resend').addEventListener('click',()=>toast(t('a.resent',{code:DEMO_CODE})));
    $('#a-change').addEventListener('click',()=>{a.step='phone';renderAuth()});
  }
  else if(a.step==='name'){
    b.innerHTML=`<div><h1>${pro?t('a.name.pro.h'):t('a.name.h')}</h1><p class="lead" style="margin-top:6px">${pro?t('a.name.pro.sub'):t('a.name.sub')}</p></div>
      <form class="form" id="f-aname" novalidate>
        <div class="field" id="fw-aname"><label for="a-name">${pro?t('a.name.pro.label'):t('a.name.label')}</label><input id="a-name" autocomplete="name" placeholder="${pro?t('a.name.ph.pro'):t('a.name.ph')}" value="${esc(a.name)}" autofocus><span class="err">${t('a.name.err')}</span></div>
        <button type="submit" class="btn primary lg">${ic('check')}${pro?t('a.name.next.pro'):t('a.name.done')}</button>
      </form>`;
    $('#f-aname').addEventListener('submit',e=>{
      e.preventDefault();const name=$('#a-name').value.trim();
      if(!name){$('#fw-aname').classList.add('invalid');return}
      state.accounts[a.phone]={phone:a.phone,name,role:a.role,createdAt:Date.now(),profile:null};persistAccounts();
      finishLogin(a.phone,true);
    });
  }
}
function finishLogin(phone,fresh=false){
  state.session={phone};save(K.ses,state.session);
  const acc=state.accounts[phone];
  state.tab=acc.role==='pro'?'activite':'clients';state.editing=false;state.auth=null;
  go('main');
  toast(t(fresh?'welcome.new':'welcome.back',{name:firstName(acc.name)}));
}
function enterGuest(){state.session={guest:true};save(K.ses,state.session);state.tab='clients';go('main')}
function logout(){state.session=null;save(K.ses,null);state.tab='clients';go('welcome')}

/* ---------- main: header, tabs ---------- */
function renderHeader(){
  const m=me(), b=$('#acctbtn');
  b.innerHTML=m?(m.profile?.photo?`<img src="${m.profile.photo}" alt="">`:esc(initials(m.name))):ic('user');
  b.style.background=m?hue(m.phone):'';
}
function tabsFor(){
  const x=[];
  if(isPro()) x.push({id:'activite',icon:'gauge',live:!!myProfile()?.available});
  x.push({id:'clients',icon:'bolt'},{id:'store',icon:'store'},{id:'account',icon:'user'});
  return x;
}
function renderTabs(){
  $('#tabbar').innerHTML=tabsFor().map(x=>`<button type="button" data-tab="${x.id}" aria-pressed="${state.tab===x.id}">${ic(x.icon)}${t('tab.'+x.id)}${x.live?'<span class="live"></span>':''}</button>`).join('');
}
function setTab(x,silent){
  if(!tabsFor().some(y=>y.id===x)) x='clients';
  state.tab=x;
  document.querySelectorAll('#tabbar [data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===x));
  ['clients','activite','store','account'].forEach(v=>$('#view-'+v).hidden=v!==x);
  if(x==='clients'){renderSkillChips();renderList()}
  if(x==='activite')renderActivite();
  if(x==='store')renderStore();
  if(x==='account')renderAccount();
  if(!silent)window.scrollTo({top:0});
}

/* ---------- client home ---------- */
function renderSkillChips(){
  $('#skillchips').innerHTML=['Tous',...SKILLS].map(s=>`<button type="button" class="chip" data-skill="${esc(s)}" aria-pressed="${state.skill===s}">${s==='Tous'?t('skill.all'):esc(skill(s))}</button>`).join('');
}
function renderList(){
  const all=allElectricians(), dispo=all.filter(e=>e.available);
  $('#cnt-dispo').textContent=dispo.length;$('#cnt-all').textContent=all.length;
  $('#mode-dispo').setAttribute('aria-pressed',state.mode==='dispo');
  $('#mode-all').setAttribute('aria-pressed',state.mode==='all');
  $('#locname').textContent=originLabel();
  let items=(state.mode==='dispo'?dispo:all).filter(e=>state.skill==='Tous'||e.skills.includes(state.skill));
  items.sort((a,b)=>(b.available-a.available)||(a.dist-b.dist));
  const near=dispo.filter(e=>e.dist<=15).length;
  $('#radar-count').innerHTML=`${countElec(near)}<span>${t('c.within',{place:esc(originLabel())})}</span>`;
  renderRadar(items);
  const far=items.length&&Math.min(...items.map(e=>e.dist))>120;
  $('#list').innerHTML=items.length?items.map(cardHTML).join(''):`<div class="empty">${ic('bolt')}<h3>${t('c.empty.h',{skill:esc(skill(state.skill))})}</h3><p>${t('c.empty.p')}</p></div>`;
  $('#demonote').innerHTML=far
    ?`${ic('info')}<span>${t('c.far',{place:esc(originLabel())})}</span>`
    :`${ic('info')}<span>${t('c.demo')} ${isPro()?t('c.demo.pro'):t('c.demo.client')}</span>`;
}
function renderRadar(items){
  const W=320,H=224,cx=160,cy=112,Rr=98,dmax=12;
  const rOf=d=>Rr*Math.sqrt(Math.min(d,dmax)/dmax);
  const rings=[2,5,10].map(d=>`<circle class="ring" cx="${cx}" cy="${cy}" r="${rOf(d).toFixed(1)}"/><text class="lbl" x="${cx+4}" y="${(cy-rOf(d)-3).toFixed(1)}">${d} ${t('km')}</text>`).join('');
  const sweep=`<defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2B233" stop-opacity="0"/><stop offset="1" stop-color="#F2B233" stop-opacity=".22"/></linearGradient></defs><path class="sweep" d="M${cx} ${cy} L${cx} ${cy-Rr} A${Rr} ${Rr} 0 0 1 ${(cx+Rr*Math.sin(70*R2D)).toFixed(1)} ${(cy-Rr*Math.cos(70*R2D)).toFixed(1)} Z" fill="url(#sw)"/>`;
  const dots=items.map(e=>{
    const r=rOf(e.dist), θ=bearing(state.origin,e);
    const x=cx+r*Math.sin(θ), y=cy-r*Math.cos(θ);
    return `<g class="dot ${e.available?'':'off'} ${e.mine?'mine':''}" data-open="${e.id}" role="button" tabindex="0" aria-label="${esc(e.name)}, ${fmtKm(e.dist)}"><circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16"/><circle class="core" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${e.available?'var(--ok)':'#6E6E68'}"/><text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle">${esc(initials(e.name))}</text></g>`;
  }).join('');
  $('#radar').innerHTML=`${sweep}${rings}<circle cx="${cx}" cy="${cy}" r="${Rr}" class="ring"/><text class="lbl" x="${cx}" y="12" text-anchor="middle">${t('north')}</text>${dots}<circle cx="${cx}" cy="${cy}" r="5" fill="#F2B233"/><circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="#F2B233" stroke-opacity=".5"/>`;
}
function cardHTML(e){
  return `<article class="card el ${e.available?'':'off'}" data-card="${e.id}">
    ${avatar(e)}
    <div>
      <div class="el-head"><div class="name">${esc(e.name)}${e.mine?`<span class="you">${t('you')}</span>`:''}</div>${statusPill(e)}</div>
      <div class="meta">${rating(e)}<span>${ic('pin','pin')} <b>${fmtKm(e.dist)}</b> · ${esc(e.zone)}</span></div>
      <div class="skills">${e.skills.map(s=>esc(skill(s))).join(' · ')}</div>
      <div class="actions">${callBtn(e,'primary')}<button type="button" class="btn" data-open="${e.id}">${t('view')}</button></div>
    </div>
  </article>`;
}
function callBtn(e,cls){
  if(e.demo) return `<button type="button" class="btn ${cls}" data-call="${e.id}">${ic('phone')}${t('call')}</button>`;
  return `<a class="btn ${cls}" href="tel:${e.telE164}" data-mycall="1">${ic('phone')}${t('call')}</a>`;
}

/* ---------- profile sheet ---------- */
function openProfile(id){
  const e=allElectricians().find(x=>x.id===id); if(!e) return;
  if(e.mine){state.stats.views++;save(K.stats,state.stats)}
  const d=$('#profile'), m=me();
  const phone=e.demo?'<span class="ltr">5• ••• •••</span>':tel(digits(e.phone));
  const reviewBox=e.mine?'':m
    ?`<div class="card" style="padding:14px"><h3>${t('p.leave')}</h3><p class="small muted" style="margin:4px 0 10px">${t('p.leave.sub',{name:esc(firstName(e.name))})}</p>
      <div class="starpick" id="starpick" role="radiogroup">${[1,2,3,4,5].map(i=>`<button type="button" data-star="${i}" aria-label="${t('p.stars',{n:i})}">${ic('star','fill')}</button>`).join('')}</div>
      <div class="field" style="margin-top:10px"><textarea id="revtext" placeholder="${t('p.revph')}" rows="2"></textarea></div>
      <button type="button" class="btn dark block" id="revsend" style="margin-top:10px" disabled>${t('p.publish')}</button></div>`
    :`<div class="card" style="padding:14px"><h3>${t('p.leave')}</h3><p class="small muted" style="margin:4px 0 10px">${t('p.needacc',{name:esc(firstName(e.name))})}</p><button type="button" class="btn dark block" data-auth="signup:client">${t('p.createclient')}</button></div>`;
  d.innerHTML=`<div class="grab"></div>
  <div class="sheet-head"><span class="eyebrow">${t('p.eyebrow')}</span><button class="close" type="button" data-close="profile" aria-label="${t('close')}">${ic('x')}</button></div>
  <div class="sheet-body">
    <div class="phead">${avatar(e,'lg')}<div><h2>${esc(e.name)}${e.mine?`<span class="you">${t('you')}</span>`:''}</h2>
      <div style="margin-top:6px">${statusPill(e)}${e.available&&e.since?`<span class="small muted" style="margin-inline-start:8px">${t('since',{time:fmtTime(e.since)})}</span>`:''}</div>
      <div class="meta">${e.count?`<span>${ic('star','fill')} <b>${dec(e.rating)}</b> <span class="muted">${t('p.reviews.n',{n:e.count})}</span></span>`:`<span class="muted">${t('p.noreviews')}</span>`}<span>${ic('pin','pin')} <b>${fmtKm(e.dist)}</b> · ${esc(e.zone)}</span></div>
    </div></div>
    <p class="lead">${esc(e.desc)||`<span class="muted">${t('p.nodesc')}</span>`}</p>
    <div><p class="eyebrow" style="margin-bottom:8px">${t('p.skills')}</p><div class="chips wrap">${e.skills.map(s=>`<span class="chip">${esc(skill(s))}</span>`).join('')}</div></div>
    <div class="kv"><span class="eyebrow">${t('p.phone')}</span><b>${phone}</b></div>${e.demo?`<p class="small muted" style="margin-top:-8px">${t('p.masked')}</p>`:''}
    <div><p class="eyebrow" style="margin-bottom:8px">${t('p.reviews',{n:e.reviews.length})}</p>
      ${e.reviews.length?e.reviews.map(r=>`<div class="review"><div class="who"><span style="color:var(--ink)">${esc(r.who)}</span><span>${esc(r.date)}</span></div>${starRow(r.stars)}<p>${esc(r.text)}</p></div>`).join(''):`<p class="small muted">${t('p.first')}</p>`}
    </div>
    ${reviewBox}
  </div>
  <div class="sheet-foot">${callBtn(e,'primary lg')}${e.demo?`<button type="button" class="btn lg" data-wa="${e.id}">${ic('chat')}${t('wa')}</button>`:`<a class="btn lg" href="https://wa.me/${digits(e.telE164)}" target="_blank" rel="noopener">${ic('chat')}${t('wa')}</a>`}</div>`;
  let stars=0;
  d.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',()=>{stars=+b.dataset.star;d.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=stars));d.querySelector('#revsend').disabled=false}));
  d.querySelector('#revsend')?.addEventListener('click',()=>{
    const text=d.querySelector('#revtext').value.trim()||t('p.default');
    (state.reviews[id]=state.reviews[id]||[]).unshift({who:m.name,stars,text});
    save(K.rev,state.reviews);toast(t('p.thanks'));renderList();openProfile(id);
  });
  if(!d.open) d.showModal();
  d.querySelector('.sheet-body').scrollTop=0;
}

/* ---------- pro: activité ---------- */
function renderActivite(){
  const v=$('#activite'), acc=me(); if(!acc) return;
  const mp=myProfile();
  if(mp&&!state.editing){
    const all=allElectricians(), mine=all.find(e=>e.mine);
    const rank=all.filter(e=>e.available).sort((a,b)=>a.dist-b.dist).findIndex(e=>e.mine)+1;
    const rankTxt=mine.available&&rank?(lang==='fr'?`${rank}<sup style="font-size:12px">${rank===1?'er':'e'}</sup>`:`${rank}`):'—';
    v.innerHTML=`
      <div class="statuscard ${mine.available?'on':''}">
        <div class="row"><div class="big"><span class="dot"></span>${mine.available?t('status.ok'):t('status.off')}</div><button type="button" class="switch" id="switch" role="switch" aria-checked="${mine.available}" aria-label="${t('act.switch')}"></button></div>
        <p>${mine.available?`${t('act.on.p')}${mine.since?t('act.since',{time:fmtTime(mine.since)}):''}`:t('act.off.p')}</p>
      </div>
      <div class="stats"><div class="stat"><b>${state.stats.calls}</b><span>${t('act.calls')}</span></div><div class="stat"><b>${state.stats.views}</b><span>${t('act.views')}</span></div><div class="stat"><b>${rankTxt}</b><span>${t('act.rank',{place:esc(originLabel())})}</span></div></div>
      <div><p class="eyebrow" style="margin-bottom:8px">${t('act.preview')}</p><div class="list">${cardHTML(mine)}</div></div>
      <div style="display:flex;gap:8px"><button type="button" class="btn" id="editbtn">${ic('edit')}${t('act.edit')}</button><button type="button" class="btn ghost danger" id="delbtn">${t('act.delete')}</button></div>
      <div class="note">${ic('info')}<span>${t('act.note')}</span></div>`;
    $('#switch').addEventListener('click',()=>{mp.available=!mp.available;mp.since=mp.available?Date.now():0;persistAccounts();renderActivite();renderTabs();toast(t(mp.available?'act.toast.on':'act.toast.off'))});
    $('#editbtn').addEventListener('click',()=>{state.editing=true;renderActivite();window.scrollTo({top:0})});
    $('#delbtn').addEventListener('click',()=>{if(confirm(t('act.confirmdel'))){acc.profile=null;persistAccounts();state.stats={views:0,calls:0};save(K.stats,state.stats);renderActivite();renderTabs()}});
    return;
  }
  const m=mp||{name:acc.name,zoneId:'nabeul',skills:[],desc:'',photo:''};
  v.innerHTML=`
    ${state.editing?'':`<div><h1>${t('f.welcome',{name:esc(firstName(acc.name))})}</h1><p class="lead">${t('f.welcome.sub')}</p></div>`}
    <form class="form card" id="proform" novalidate>
      <h2>${state.editing?t('act.edit'):t('f.title')}</h2>
      <div class="photo-row"><div class="avatar lg" id="photoprev" style="--h:${hue(acc.phone)}">${m.photo?`<img src="${m.photo}" alt="">`:(m.name?esc(initials(m.name)):ic('cam'))}</div><label class="btn" for="f-photo" tabindex="0">${ic('cam')}${t('f.photo')}</label><input type="file" id="f-photo" accept="image/*"></div>
      <div class="field" id="fw-name"><label for="f-name">${t('f.name')}</label><input id="f-name" value="${esc(m.name)}" placeholder="${t('a.name.ph.pro')}" autocomplete="name"><span class="err">${t('f.name.err')}</span></div>
      <div class="kv"><span>${ic('phone')} ${t('f.callat')}</span><b>${tel(acc.phone)}</b></div>
      <div class="field"><label for="f-zone">${t('f.zone')}</label><select id="f-zone">${CITIES.map(c=>`<option value="${c.id}" ${c.id===m.zoneId?'selected':''}>${esc(L(c.name))}</option>`).join('')}</select></div>
      <div class="field" id="fw-skills"><label>${t('f.skills')}</label><div class="chips wrap" id="fskills">${SKILLS.map(s=>`<button type="button" class="chip sel" data-fs="${esc(s)}" aria-pressed="${m.skills.includes(s)}">${esc(skill(s))}</button>`).join('')}</div><span class="err">${t('f.skills.err')}</span></div>
      <div class="field"><label for="f-desc">${t('f.desc')} <em>${t('f.optional')}</em></label><textarea id="f-desc" placeholder="${t('f.desc.ph')}">${esc(m.desc)}</textarea></div>
      <div style="display:flex;gap:8px"><button type="submit" class="btn primary lg">${ic('check')}${state.editing?t('f.save'):t('f.publish')}</button>${state.editing?`<button type="button" class="btn lg" id="cancel">${t('f.cancel')}</button>`:''}</div>
    </form>`;
  let photo=m.photo||'';
  $('#f-photo').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(img.width,img.height),S=192;c.width=c.height=S;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);photo=c.toDataURL('image/jpeg',.8);$('#photoprev').innerHTML=`<img src="${photo}" alt="">`};img.src=r.result};r.readAsDataURL(f)});
  $('#f-name').addEventListener('input',e=>{if(!photo){$('#photoprev').innerHTML=e.target.value?esc(initials(e.target.value)):ic('cam')}});
  $('#fskills').addEventListener('click',e=>{const b=e.target.closest('[data-fs]');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});
  $('#cancel')?.addEventListener('click',()=>{state.editing=false;renderActivite()});
  $('#proform').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#f-name').value.trim(),skills=[...document.querySelectorAll('#fskills [aria-pressed="true"]')].map(b=>b.dataset.fs);
    let ok=true;
    $('#fw-name').classList.toggle('invalid',!name);ok&&=!!name;
    $('#fw-skills').classList.toggle('invalid',!skills.length);ok&&=!!skills.length;
    if(!ok){toast(t('f.fix'));return}
    const c=CITIES.find(x=>x.id===$('#f-zone').value), prev=mp||{};
    acc.name=name;
    acc.profile={id:'me',name,phone:acc.phone,telE164:'+216'+acc.phone,zoneId:c.id,lat:prev.zoneId===c.id?prev.lat:c.lat+(Math.random()-.5)*.01,lng:prev.zoneId===c.id?prev.lng:c.lng+(Math.random()-.5)*.01,skills,desc:$('#f-desc').value.trim(),photo,rating:0,count:0,reviews:[],available:prev.available??true,since:prev.since??Date.now()};
    persistAccounts();state.editing=false;renderActivite();renderTabs();renderHeader();
    toast(t(prev.name?'f.updated':'f.published'));window.scrollTo({top:0});
  });
}

/* ---------- store ---------- */
function renderStore(){
  $('#storerows').innerHTML=`
    <a href="${STORE.maps}" target="_blank" rel="noopener">${ic('pin')}<span>${t('s.addr')}</span>${ic('chev','arrow')}</a>
    <a href="tel:${STORE.telE164}">${ic('phone')}<span class="ltr">${STORE.tel}</span>${ic('chev','arrow')}</a>
    <a href="mailto:${STORE.mail}">${ic('mail')}<span class="ltr">${STORE.mail}</span>${ic('chev','arrow')}</a>
    <a href="https://${STORE.site}" target="_blank" rel="noopener">${ic('globe')}<span class="ltr">${STORE.site}</span>${ic('chev','arrow')}</a>
    <a href="${STORE.fb}" target="_blank" rel="noopener">${ic('globe')}<span class="ltr">Facebook · Log-ON</span>${ic('chev','arrow')}</a>
    <a href="${STORE.ig}" target="_blank" rel="noopener">${ic('globe')}<span class="ltr">Instagram · @logontn</span>${ic('chev','arrow')}</a>`;
  $('#soon').innerHTML=['shield','box','bulb','tag'].map((i,n)=>`<div>${ic(i)}<span><b>${t(`s.${n+1}.h`)}</b> — ${t(`s.${n+1}.p`)}</span></div>`).join('');
}

/* ---------- account ---------- */
const langRow=()=>`<div class="r">${ic('lang')}<span>${t('acc.lang')}</span><span class="langseg"><button type="button" data-lang="fr" aria-pressed="${lang==='fr'}">Français</button><button type="button" data-lang="ar" aria-pressed="${lang==='ar'}">عربي</button></span></div>`;
function renderAccount(){
  const v=$('#account'), m=me();
  if(!m){
    v.innerHTML=`<div class="card"><div class="acct-head"><div class="avatar lg" style="--h:#6E6E68">${ic('user')}</div><div><h2>${t('acc.guest.h')}</h2><p class="lead small">${t('acc.guest.p')}</p></div></div></div>
      <div style="display:flex;gap:8px"><button type="button" class="btn primary lg" data-auth="signup:client">${t('acc.create')}</button><button type="button" class="btn lg" data-auth="login:client">${t('login')}</button></div>
      <div class="card"><div class="rows">
        <button type="button" data-auth="signup:pro">${ic('bolt')}<span>${t('acc.ispro')}</span><span class="sub">${t('acc.ispro.sub')}</span></button>
        ${langRow()}
        <button type="button" id="quit">${ic('out')}<span>${t('acc.quit')}</span></button>
      </div></div>`;
    $('#quit').addEventListener('click',logout);
    return;
  }
  const pro=m.role==='pro';
  v.innerHTML=`<div class="card"><div class="acct-head"><div class="avatar lg" style="--h:${hue(m.phone)}">${m.profile?.photo?`<img src="${m.profile.photo}" alt="">`:esc(initials(m.name))}</div><div><h2>${esc(m.name)}</h2><p class="small muted">${tel(m.phone)}</p><span class="pill ${pro?'pro':''}" style="margin-top:6px">${pro?t('acc.pro'):t('acc.client')}</span></div></div></div>
    <div class="card"><div class="rows">
      ${pro?`<button type="button" data-tab="activite">${ic('edit')}<span>${t('acc.fiche')}</span>${ic('chev','arrow')}</button>`:`<button type="button" id="become-pro">${ic('bolt')}<span>${t('acc.become')}</span><span class="sub">${t('acc.become.sub')}</span></button>`}
      ${langRow()}
      <a href="${STORE.fb}" target="_blank" rel="noopener">${ic('store')}<span>${t('acc.about')}</span>${ic('chev','arrow')}</a>
      <button type="button" id="logout" class="danger">${ic('out')}<span>${t('acc.logout')}</span></button>
    </div></div>
    <p class="small muted" style="text-align:center">${t('acc.created',{date:new Date(m.createdAt).toLocaleDateString(locale())})}</p>`;
  $('#logout').addEventListener('click',logout);
  $('#become-pro')?.addEventListener('click',()=>{m.role='pro';persistAccounts();state.tab='activite';renderTabs();setTab('activite');toast(t('acc.became'))});
}

/* ---------- location ---------- */
function setOrigin(o){state.origin=o;save(K.loc,o);if(state.screen==='main')setTab(state.tab,true);renderCities()}
function renderCities(){
  $('#citylist').innerHTML=CITIES.map(c=>`<button type="button" data-city="${c.id}" class="${state.origin.id===c.id?'on':''}">${ic(state.origin.id===c.id?'check':'pin')}${esc(L(c.name))}</button>`).join('');
}
$('#locbtn').addEventListener('click',()=>{renderCities();$('#locdlg').showModal()});
$('#citylist').addEventListener('click',e=>{const b=e.target.closest('[data-city]');if(!b)return;const c=CITIES.find(x=>x.id===b.dataset.city);setOrigin({id:c.id,lat:c.lat,lng:c.lng});$('#locdlg').close()});
$('#geobtn').addEventListener('click',()=>{
  if(!navigator.geolocation){toast(t('loc.unavail'));return}
  const b=$('#geobtn');b.disabled=true;b.textContent=t('loc.searching');
  const reset=()=>{b.disabled=false;b.innerHTML=`${ic('target')}<span>${t('loc.use')}</span>`};
  navigator.geolocation.getCurrentPosition(p=>{reset();setOrigin({id:'gps',lat:p.coords.latitude,lng:p.coords.longitude});$('#locdlg').close();toast(t('loc.done'))},()=>{reset();toast(t('loc.denied'))},{timeout:8000,maximumAge:60000});
});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const x=e.target.closest('button,a,[data-open]');
  if(!x){const c=e.target.closest('[data-card]');if(c)openProfile(c.dataset.card);return}
  if(x.dataset.langtoggle!==undefined){setLang(lang==='fr'?'ar':'fr');return}
  if(x.dataset.lang){if(x.dataset.lang!==lang)setLang(x.dataset.lang);return}
  if(x.dataset.guest!==undefined){enterGuest();return}
  if(x.dataset.auth){const [mode,role]=x.dataset.auth.split(':');$('#profile').open&&$('#profile').close();startAuth(mode,role);return}
  if(x.id==='auth-back'){const a=state.auth;if(a&&a.step!=='phone'){a.step=a.step==='name'?'code':'phone';renderAuth()}else go(state.session?'main':'welcome');return}
  if(x.id==='acctbtn'){setTab('account');return}
  if(x.dataset.tab){setTab(x.dataset.tab);return}
  if(x.dataset.skill){state.skill=x.dataset.skill;renderSkillChips();renderList();return}
  if(x.id==='mode-dispo'){state.mode='dispo';renderList();return}
  if(x.id==='mode-all'){state.mode='all';renderList();return}
  if(x.dataset.open){openProfile(x.dataset.open);return}
  if(x.dataset.close){$('#'+x.dataset.close).close();return}
  if(x.dataset.call){const el=DEMO.find(y=>y.id===x.dataset.call);toast(t('p.democall',{name:firstName(L(el.name))}));return}
  if(x.dataset.wa){toast(t('p.demowa'));return}
  if(x.dataset.mycall){state.stats.calls++;save(K.stats,state.stats);if(state.tab==='activite')renderActivite();return}
  const c=x.closest('[data-card]');if(c&&!x.dataset.call&&!x.dataset.mycall)openProfile(c.dataset.card);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-open][role="button"]'))openProfile(e.target.dataset.open)});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

/* ---------- boot ---------- */
if(state.session){state.screen='main';state.tab=isPro()?'activite':'clients'}
applyStatic();render();
</script>
</body>
</html>
