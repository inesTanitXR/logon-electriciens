<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Trouvez un électricien disponible près de chez vous à Nabeul et appelez-le directement. Par Log-ON lighting.">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Log-ON">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Log-ON Électriciens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Dancing+Script:wght@600&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <section id="s-welcome" class="welcome" hidden>
    <div class="topline"><button type="button" class="langbtn" data-langtoggle><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h10M9 3v2c0 5-3 9-6 11M6 9c1 3 4 6 8 8M13 20l4-9 4 9M14.5 17h5"/></svg><span data-t="lang.other"></span></button></div>
    <div class="glow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.8.6 1.4 1.5 1.4 2.5V18h5v-1.3c0-1 .6-1.9 1.4-2.5A6.5 6.5 0 0 0 12 2.5z"/><path d="M9.5 21h5"/><path d="M12 7.5v4"/></svg></div>
    <div class="titles">
      <span class="by" data-th="by"></span>
      <h1 data-th="w.title"></h1>
      <p class="tag" data-t="w.tag"></p>
    </div>
    <div class="door">
      <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg><span data-t="w.client.h"></span></h2>
      <p data-t="w.client.p"></p>
      <div class="row"><button type="button" class="btn primary lg" data-guest data-t="w.client.btn"></button></div>
    </div>
    <div class="door">
      <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><span data-t="w.pro.h"></span></h2>
      <p data-t="w.pro.p"></p>
      <div class="row"><button type="button" class="btn light lg" data-auth="signup:pro" data-t="w.pro.create"></button><button type="button" class="btn onDark lg" data-auth="login:pro" data-t="login"></button></div>
    </div>
    <p class="foot"><span data-t="w.foot"></span> <button type="button" data-auth="login:client" data-t="login"></button></p>
  </section>

  <section id="s-auth" hidden>
    <div class="authbar"><button type="button" id="auth-back" data-ta="aria-label:back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button></div>
    <div class="auth" id="auth-body"></div>
  </section>

  <div id="s-main" hidden>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Log-ON lighting"><circle cx="32" cy="32" r="32" fill="#161616"/><text x="34.5" y="34" text-anchor="end" font-family="Outfit, sans-serif" font-weight="600" font-size="13.5" fill="#fff" letter-spacing=".2">Log-</text><g transform="translate(35.2 23.5) scale(.5)" fill="none" stroke="#F2B233" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.8.6 1.4 1.5 1.4 2.5V18h5v-1.3c0-1 .6-1.9 1.4-2.5A6.5 6.5 0 0 0 12 2.5z"/><path d="M9.6 21h4.8"/></g><text x="48.2" y="34" text-anchor="start" font-family="Outfit, sans-serif" font-weight="600" font-size="13.5" fill="#fff">N</text><text x="33" y="47" text-anchor="middle" font-family="'Dancing Script', cursive" font-weight="600" font-size="11" fill="#fff">lighting</text></svg>
        <div class="wordmark"><span data-t="h.title"></span><small data-t="h.sub"></small></div>
      </div>
      <button class="acctbtn" id="acctbtn" type="button" data-ta="aria-label:h.account"></button>
    </header>

    <main id="view-clients" hidden>
      <div class="darkblock">
        <div class="row">
          <div class="count" id="radar-count"></div>
          <button class="locbtn" id="locbtn" type="button" aria-haspopup="dialog">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span id="locname"></span>
            <svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <div>
          <svg class="radar" id="radar" viewBox="0 0 320 224" role="img" data-ta="aria-label:radar.aria"></svg>
          <div class="legend"><span><i style="background:#F2B233"></i><span data-t="you"></span></span><span><i style="background:var(--ok)"></i><span data-t="status.ok"></span></span><span><i style="background:#F2B233;opacity:.7"></i><span data-t="status.evening"></span></span><button type="button" class="langbtn" id="mapbtn" style="margin-inline-start:auto;padding:4px 10px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6z M9 4v14 M15 6v14"/></svg><span data-t="map.open"></span></button></div>
        </div>
      </div>
      <div class="content">
        <div id="prompt"></div>
        <div class="seg" role="group">
          <button type="button" data-mode="now" aria-pressed="true"><span data-t="c.now"></span> <span class="cnt" id="cnt-now">0</span></button>
          <button type="button" data-mode="evening" aria-pressed="false"><span data-t="c.evening"></span> <span class="cnt" id="cnt-evening">0</span></button>
          <button type="button" data-mode="all" aria-pressed="false"><span data-t="c.all"></span> <span class="cnt" id="cnt-all">0</span></button>
        </div>
        <div class="chips" id="skillchips"></div>
        <div id="listnote"></div>
        <div class="list" id="list"></div>
        <div class="note" id="demonote" hidden></div>
      </div>
    </main>

    <main id="view-activite" hidden><div class="content" id="activite"></div></main>

    <main id="view-store" hidden><div class="content">
      <div class="card">
        <div class="storehead">
          <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Log-ON lighting"><circle cx="32" cy="32" r="32" fill="#161616"/><text x="34.5" y="34" text-anchor="end" font-family="Outfit, sans-serif" font-weight="600" font-size="13.5" fill="#fff" letter-spacing=".2">Log-</text><g transform="translate(35.2 23.5) scale(.5)" fill="none" stroke="#F2B233" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.8.6 1.4 1.5 1.4 2.5V18h5v-1.3c0-1 .6-1.9 1.4-2.5A6.5 6.5 0 0 0 12 2.5z"/><path d="M9.6 21h4.8"/></g><text x="48.2" y="34" text-anchor="start" font-family="Outfit, sans-serif" font-weight="600" font-size="13.5" fill="#fff">N</text><text x="33" y="47" text-anchor="middle" font-family="'Dancing Script', cursive" font-weight="600" font-size="11" fill="#fff">lighting</text></svg>
          <div><h2>Log-ON lighting</h2><p class="lead small" data-t="s.tag"></p></div>
        </div>
      </div>
      <div class="card"><div class="rows" id="storerows"></div></div>
      <div class="card"><div class="vline" style="margin-bottom:6px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg><span data-t="s.verif"></span></div><p class="lead small" data-t="s.verif.p"></p></div>
      <div class="card"><p class="eyebrow" style="margin-bottom:10px" data-t="s.soon"></p><div class="soon" id="soon"></div></div>
    </div></main>

    <main id="view-account" hidden><div class="content" id="account"></div></main>
    <main id="view-admin" hidden><div class="content" id="admin"></div></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" data-ta="aria-label:nav" hidden></nav>

<dialog id="profile" data-ta="aria-label:p.aria"></dialog>
<dialog id="mapdlg" data-ta="aria-label:map.open">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="maptitle"></h2><button class="close" type="button" data-close="mapdlg" data-ta="aria-label:close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="mapfull" id="mapfull"></div>
</dialog>
<dialog id="pindlg" aria-label="PIN">
  <div class="grab"></div>
  <div class="sheet-head"><h2 data-t="acc.pin"></h2><button class="close" type="button" data-close="pindlg" data-ta="aria-label:close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <form class="sheet-body form" id="pinform" novalidate>
    <div class="field"><label for="p-pin" data-t="acc.pin.new"></label><input id="p-pin" class="codebox" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••"></div>
    <button type="submit" class="btn primary lg" data-t="f.save"></button>
  </form>
</dialog>
<dialog id="locdlg" data-ta="aria-label:loc.aria">
  <div class="grab"></div>
  <div class="sheet-head"><h2 data-t="loc.h"></h2><button class="close" type="button" data-close="locdlg" data-ta="aria-label:close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body">
    <button class="btn dark lg" type="button" id="geobtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span data-t="loc.use"></span></button>
    <p class="eyebrow" data-t="loc.or"></p>
    <div class="citylist" id="citylist"></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
